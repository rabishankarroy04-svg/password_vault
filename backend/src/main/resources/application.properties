server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securevault_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:securevault_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration
spring.sql.init.mode=never
securevault.schema.auto-init=${SECUREVAULT_SCHEMA_AUTO_INIT:always}
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.mfa.encryption-key-base64=${MFA_ENCRYPTION_KEY_BASE64:${security.jwt.secret-base64}}
security.vault.encryption-key-base64=${VAULT_ENCRYPTION_KEY_BASE64:${security.jwt.secret-base64}}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
security.threat.failed-login.threshold=${SECUREVAULT_FAILED_LOGIN_THRESHOLD:4}
security.threat.failed-login.window-minutes=${SECUREVAULT_FAILED_LOGIN_WINDOW_MINUTES:5}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
securevault.mail.from=${SECUREVAULT_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
securevault.schema.reset=${SECUREVAULT_SCHEMA_RESET:false}
resend.api.key=${RESEND_API_KEY:}
securevault.resend.from=${RESEND_FROM:}
brevo.api.key=${BREVO_API_KEY:}
securevault.brevo.from=${BREVO_FROM:}
securevault.mail.log-fallback=${SECUREVAULT_MAIL_LOG_FALLBACK:true}

# Hardened security configurations
spring.servlet.multipart.enabled=false
server.forward-headers-strategy=none
security.trusted-proxy-cidrs=${SECUREVAULT_TRUSTED_PROXY_CIDRS:}
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=8KB

# Web DEBUG/TRACE logging may expose rejected password values during validation.
logging.level.org.springframework.web=INFO

securevault.external.base-url=${SECUREVAULT_EXTERNAL_BASE_URL:}
security.cors.allowed-origins=${SECUREVAULT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4300,http://127.0.0.1:4300}
