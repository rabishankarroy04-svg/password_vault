services:
  # 1. Spring Boot Backend API
  - type: web
    name: securevault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SPRING_SQL_INIT_MODE
        value: always
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: securevault-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: securevault-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: securevault-postgres
          property: password
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: MFA_ENCRYPTION_KEY_BASE64
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY_BASE64
        generateValue: true
      - key: SECUREVAULT_EXTERNAL_BASE_URL
        fromService:
          type: web
          name: securevault-frontend
          property: host
      - key: SECUREVAULT_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: securevault-frontend
          property: host
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SECUREVAULT_MAIL_FROM
        sync: false

  # 2. React + Vite Frontend (Free Static Hosting)
  - type: web
    name: securevault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /api/*
        destination: https://securevault-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Managed Database
  - name: securevault-postgres
    databaseName: securevault_db
    user: securevault_app
    plan: free
    region: oregon
